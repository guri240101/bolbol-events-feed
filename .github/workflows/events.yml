name: Refresh and publish events
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '17 0 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: events-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Refresh public source facts
        run: node refresh-events.mjs
      - name: Preserve latest feed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add events-data.json
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public event schedules'
            git push
          fi
      - name: Prepare public files
        run: mkdir -p public && cp events-data.json index.html public/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Report source errors after preserving previous data
        run: node -e "const d=require('./events-data.json');if(d.sources.some(s=>!s.ok))process.exit(1)"
