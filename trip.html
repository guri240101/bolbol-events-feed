<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>함께 보는 여행 · 뽈뽈플랜</title><style>body{font-family:system-ui,sans-serif;background:#f3f8fb;color:#244d65;margin:0}main{max-width:680px;margin:auto;padding:24px}a{display:inline-block;padding:12px 16px;border-radius:10px;background:#248db1;color:white;text-decoration:none;margin:5px 4px 12px 0}article{padding:10px 0;border-bottom:1px solid #d9e6ec}p{line-height:1.6}small{color:#657d8a}</style><main><h1>함께 떠나는 여행</h1><p id="status">여행을 여는 중…</p><div id="actions" hidden><a id="open">앱에서 일정 열기</a><a href="https://play.google.com/store/apps/details?id=com.bolbolbbu.travelhannun">앱 설치</a><p><small>설치 후 이 링크를 다시 열어 주세요. 현재 비공개 테스트는 등록된 테스터 계정으로 참여할 수 있어요.</small></p><a href="https://play.google.com/apps/testing/com.bolbolbbu.travelhannun">테스트 참여</a></div><section id="plan"></section></main><script type="module">async function decodeTripLink(code){
 if(typeof code!=='string'||code.length>24000||!/^[-_a-zA-Z0-9]+$/.test(code))throw Error('잘못된 여행 링크예요.');
 const bytes=Uint8Array.from(atob(code.replaceAll('-','+').replaceAll('_','/')),c=>c.charCodeAt(0));
 const reader=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip')).getReader();let size=0,parts=[];
 while(true){const {value,done}=await reader.read();if(done)break;size+=value.length;if(size>2000000){await reader.cancel();throw Error('여행 링크가 너무 커요.');}parts.push(value);}
 return JSON.parse(await new Blob(parts).text());
}

try{const code=location.hash.slice(1),data=await decodeTripLink(code);if(data.kind!=='bolbolplan-trip'||!Array.isArray(data.trip?.rows)||data.trip.rows.length>14)throw Error('잘못된 여행 링크예요.');document.getElementById('status').textContent=(data.trip.config.date+' ~ '+data.trip.config.endDate).replaceAll('-','/');document.getElementById('actions').hidden=false;document.getElementById('open').href='intent://shared/#'+code+';end';const app='bolbolplan://shared/#'+code;document.getElementById('open').href=app;for(const [i,day]of data.trip.rows.entries()){const h=document.createElement('h2');h.textContent=(i+1)+'일차';document.getElementById('plan').append(h);for(const r of day){const a=document.createElement('article');const strong=document.createElement('strong');strong.textContent=r.time+' '+r.place.name;const p=document.createElement('p');p.textContent=r.place.address;a.append(strong,p);document.getElementById('plan').append(a);}}}catch(e){document.getElementById('status').textContent='링크를 열 수 없어요. '+e.message;}</script></html>
